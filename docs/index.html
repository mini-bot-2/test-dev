<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0ea5e9" />
    <title>Hello World</title>
    <style>
      :root {
        --bg0: #070a12;
        --bg1: #0b1220;
        --card: rgba(255, 255, 255, 0.08);
        --card-border: rgba(255, 255, 255, 0.14);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.68);
        --accent: #38bdf8;
        --accent-2: #a78bfa;
        --shadow: rgba(0, 0, 0, 0.5);
      }

      [data-theme="light"] {
        --bg0: #f6f7fb;
        --bg1: #eef2ff;
        --card: rgba(255, 255, 255, 0.8);
        --card-border: rgba(15, 23, 42, 0.1);
        --text: rgba(15, 23, 42, 0.95);
        --muted: rgba(15, 23, 42, 0.72);
        --accent: #0284c7;
        --accent-2: #7c3aed;
        --shadow: rgba(2, 6, 23, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          Apple Color Emoji,
          Segoe UI Emoji;
        color: var(--text);
        background: radial-gradient(1200px 700px at 15% 10%, rgba(56, 189, 248, 0.28), transparent 60%),
          radial-gradient(900px 600px at 85% 30%, rgba(167, 139, 250, 0.24), transparent 55%),
          linear-gradient(180deg, var(--bg0), var(--bg1));
        display: grid;
        place-items: center;
        padding: 28px 16px;
      }

      .wrap {
        width: min(880px, 100%);
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--card-border);
        box-shadow: 0 12px 40px var(--shadow);
        backdrop-filter: blur(10px);
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 30%, #fff, var(--accent));
        box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.18);
      }

      .badge strong {
        letter-spacing: 0.02em;
        font-size: 13px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border-radius: 999px;
        padding: 10px 14px;
        border: 1px solid var(--card-border);
        background: var(--card);
        color: var(--text);
        cursor: pointer;
        backdrop-filter: blur(10px);
        box-shadow: 0 12px 40px var(--shadow);
        transition:
          transform 120ms ease,
          border-color 120ms ease,
          background-color 120ms ease;
      }

      .button:hover {
        transform: translateY(-1px);
        border-color: color-mix(in srgb, var(--accent) 35%, var(--card-border));
      }

      .button:active {
        transform: translateY(0px);
      }

      .card {
        border-radius: 22px;
        background: var(--card);
        border: 1px solid var(--card-border);
        box-shadow: 0 28px 90px var(--shadow);
        backdrop-filter: blur(14px);
        overflow: hidden;
      }

      .card-inner {
        padding: 28px;
      }

      h1 {
        margin: 0;
        font-size: clamp(38px, 6vw, 58px);
        letter-spacing: -0.03em;
        line-height: 1.02;
      }

      .sub {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.55;
        max-width: 70ch;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
      }

      .stat {
        border-radius: 16px;
        padding: 14px 14px 12px;
        border: 1px solid var(--card-border);
        background: color-mix(in srgb, var(--card) 60%, transparent);
      }

      .label {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .value {
        margin-top: 6px;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .footer {
        margin-top: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 16px;
        border-top: 1px solid var(--card-border);
        color: var(--muted);
        font-size: 13px;
      }

      .kbd {
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          Liberation Mono,
          Courier New,
          monospace;
        border: 1px solid var(--card-border);
        border-bottom-color: color-mix(in srgb, var(--card-border) 55%, transparent);
        padding: 3px 8px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--card) 65%, transparent);
      }

      @media (max-width: 560px) {
        .card-inner {
          padding: 22px 18px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .footer {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
    <script>
      (function () {
        var storedTheme = localStorage.getItem("theme");
        if (storedTheme === "light" || storedTheme === "dark") {
          document.documentElement.setAttribute("data-theme", storedTheme);
        }
      })();
    </script>
  </head>
  <body>
    <main class="wrap">
      <div class="top">
        <div class="badge" aria-label="GitHub Pages site badge">
          <span class="dot" aria-hidden="true"></span>
          <strong>GitHub Pages · Static Hello World</strong>
        </div>

        <button id="theme-toggle" class="button" type="button" aria-pressed="false" aria-label="Toggle theme">
          <span aria-hidden="true">◐</span>
          <span>Theme</span>
        </button>
      </div>

      <section class="card" aria-labelledby="title">
        <div class="card-inner">
          <h1 id="title">Hello World</h1>
          <p class="sub">
            A tiny, responsive, self-contained page designed to look good on desktop and mobile, and to deploy cleanly
            with GitHub Pages.
          </p>

          <div class="grid" role="list">
            <div class="stat" role="listitem">
              <div class="label">Status</div>
              <div class="value" id="status">Ready</div>
            </div>
            <div class="stat" role="listitem">
              <div class="label">Local time</div>
              <div class="value" id="clock" aria-live="polite">--:--:--</div>
            </div>
          </div>
        </div>

        <div class="footer">
          <span>Tip: press <span class="kbd">T</span> to toggle theme.</span>
          <span id="theme-label">Theme: System</span>
        </div>
      </section>
    </main>

    <script>
      (function () {
        var themeLabel = document.getElementById("theme-label");
        var toggleButton = document.getElementById("theme-toggle");

        function getPreferredTheme() {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") return stored;

          if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
            return "light";
          }
          return "dark";
        }

        function setTheme(theme) {
          document.documentElement.setAttribute("data-theme", theme);
          localStorage.setItem("theme", theme);
          toggleButton.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
          themeLabel.textContent = "Theme: " + (theme === "light" ? "Light" : "Dark");
        }

        function toggleTheme() {
          var current = document.documentElement.getAttribute("data-theme");
          setTheme(current === "light" ? "dark" : "light");
        }

        function tickClock() {
          var clock = document.getElementById("clock");
          var now = new Date();
          clock.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
        }

        toggleButton.addEventListener("click", toggleTheme);
        window.addEventListener("keydown", function (event) {
          if (event.key === "t" || event.key === "T") toggleTheme();
        });

        setTheme(getPreferredTheme());
        tickClock();
        window.setInterval(tickClock, 1000);
      })();
    </script>
  </body>
</html>
